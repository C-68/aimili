<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>520 ❤ 我们的照片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #0a0012;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    position: fixed; top: 0; left: 0; z-index: 1;
  }

  /* ── 加载提示 ── */
  #loading-msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 99; color: #ffb3d9; font-size: 18px; letter-spacing: 0.1em;
    pointer-events: none; transition: opacity 0.5s;
  }

  /* ── UI 覆盖层 ── */
  .ui-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
    padding: 30px 20px;
    opacity: 0; transition: opacity 0.8s;
  }
  .ui-layer.ready { opacity: 1; }

  .ui-layer > * { pointer-events: auto; }

  .title-group { text-align: center; }
  .title-520 {
    font-size: clamp(48px, 8vw, 80px);
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b9d, #ff2d78, #ff8fab);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255, 64, 128, 0.5));
    letter-spacing: 0.08em;
  }
  .subtitle {
    font-size: clamp(14px, 2.5vw, 18px);
    color: rgba(255, 180, 210, 0.85);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  .bottom-bar {
    display: flex; gap: 16px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  .btn-upload {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 28px;
    border: 1.5px solid rgba(255, 107, 157, 0.5);
    border-radius: 50px;
    background: rgba(255, 64, 128, 0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ffb3d9;
    font-size: 15px; cursor: pointer;
    transition: all 0.35s;
    letter-spacing: 0.05em;
  }
  .btn-upload:hover {
    background: rgba(255, 64, 128, 0.25);
    border-color: rgba(255, 107, 157, 0.8);
    box-shadow: 0 0 30px rgba(255, 64, 128, 0.3);
    color: #fff;
  }
  .btn-upload svg { width: 20px; height: 20px; opacity: 0.9; }

  .hint-text {
    font-size: 13px; color: rgba(255, 180, 210, 0.5);
    letter-spacing: 0.08em;
  }

  .drop-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10, 0, 20, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
    transition: opacity 0.3s;
  }
  .drop-overlay.active { opacity: 1; }
  .drop-hint {
    font-size: 24px; color: #ffb3d9;
    border: 2px dashed rgba(255, 107, 157, 0.5);
    border-radius: 24px; padding: 40px 60px;
    letter-spacing: 0.1em;
  }

  .toast {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
    z-index: 50; pointer-events: none;
    background: rgba(255, 64, 128, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 107, 157, 0.4);
    color: #ffb3d9; padding: 10px 24px; border-radius: 50px;
    font-size: 14px; letter-spacing: 0.05em;
    opacity: 0; transition: opacity 0.4s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="loading-msg">正在加载...</div>

<div class="ui-layer" id="uiLayer">
  <div class="title-group">
    <div class="title-520">520</div>
    <div class="subtitle">我们的照片星球</div>
  </div>
  <div class="bottom-bar">
    <button class="btn-upload" id="btnUpload" title="选择照片文件夹">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21,15 16,10 5,21"/>
      </svg>
      选择照片
    </button>
    <span class="hint-text">拖拽以旋转 · 滚轮缩放</span>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay">
  <div class="drop-hint">💕 松开以加载照片</div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" webkitdirectory multiple accept="image/*" style="display:none">

<!-- Three.js UMD 构建 (jsdelivr CDN, 国内可用) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>

<script>
(function() {
  'use strict';

  // ── 检查 Three.js 是否加载成功 ──
  if (typeof THREE === 'undefined') {
    document.getElementById('loading-msg').textContent =
      'Three.js 加载失败，请检查网络连接后刷新页面';
    return;
  }

  // ═════════════════════════════════════════
  //  DOM refs
  // ═════════════════════════════════════════
  var btnUpload   = document.getElementById('btnUpload');
  var fileInput   = document.getElementById('fileInput');
  var dropOverlay = document.getElementById('dropOverlay');
  var toastEl     = document.getElementById('toast');
  var uiLayer     = document.getElementById('uiLayer');
  var loadingMsg  = document.getElementById('loading-msg');

  // ═════════════════════════════════════════
  //  Three.js 初始化
  // ═════════════════════════════════════════
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  var scene  = new THREE.Scene();
  scene.fog = new THREE.FogExp2('#0a0012', 0.00008);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 80);
  camera.position.set(4, 3, 14);
  camera.lookAt(0, 0, 0);

  // ═════════════════════════════════════════
  //  手动 OrbitControls (无外部依赖)
  // ═════════════════════════════════════════
  var target = new THREE.Vector3(0, 0.3, 0);
  var spherical = new THREE.Spherical();
  var sphericalDelta = new THREE.Spherical();
  var panOffset = new THREE.Vector3();
  var isMouseDown = false;
  var isDragging = false;
  var lastMouse = { x: 0, y: 0 };
  var autoRotate = true;
  var autoRotateSpeed = 0.4;
  var dampingFactor = 0.08;
  var minDistance = 5;
  var maxDistance = 25;
  var maxPolarAngle = Math.PI * 0.75;
  var rotateSpeed = 0.005;
  var zoomSpeed = 0.08;
  var lastTouches = null;
  var lastTouchDist = 0;

  // 初始化球坐标
  spherical.setFromVector3(camera.position.clone().sub(target));
  spherical.theta += 0.01;

  function updateCameraFromSpherical() {
    var pos = new THREE.Vector3().setFromSpherical(spherical).add(target);
    // 夹紧
    spherical.phi = Math.max(0.01, Math.min(maxPolarAngle, spherical.phi));
    spherical.radius = Math.max(minDistance, Math.min(maxDistance, spherical.radius));
    pos.setFromSpherical(spherical).add(target);
    camera.position.copy(pos);
    camera.lookAt(target.clone().add(panOffset));
  }

  function onMouseDown(e) {
    if (e.target !== renderer.domElement) return;
    isMouseDown = true;
    lastMouse.x = e.clientX;
    lastMouse.y = e.clientY;
  }

  function onMouseMove(e) {
    if (!isMouseDown) return;
    var dx = e.clientX - lastMouse.x;
    var dy = e.clientY - lastMouse.y;
    if (Math.abs(dx) > 0 || Math.abs(dy) > 0) isDragging = true;
    sphericalDelta.theta -= dx * rotateSpeed;
    sphericalDelta.phi   -= dy * rotateSpeed;
    lastMouse.x = e.clientX;
    lastMouse.y = e.clientY;
  }

  function onMouseUp(e) {
    isMouseDown = false;
    setTimeout(function() { isDragging = false; }, 0);
  }

  function onWheel(e) {
    if (e.target !== renderer.domElement && e.target.tagName !== 'CANVAS') return;
    e.preventDefault();
    sphericalDelta.radius += e.deltaY * zoomSpeed * 0.01;
  }

  function onTouchStart(e) {
    if (e.target !== renderer.domElement) return;
    if (e.touches.length === 1) {
      isMouseDown = true;
      lastMouse.x = e.touches[0].clientX;
      lastMouse.y = e.touches[0].clientY;
    }
    if (e.touches.length === 2) {
      lastTouches = [e.touches[0], e.touches[1]];
      lastTouchDist = Math.hypot(
        lastTouches[0].clientX - lastTouches[1].clientX,
        lastTouches[0].clientY - lastTouches[1].clientY
      );
    }
  }

  function onTouchMove(e) {
    if (e.touches.length === 1 && isMouseDown) {
      var dx = e.touches[0].clientX - lastMouse.x;
      var dy = e.touches[0].clientY - lastMouse.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) isDragging = true;
      sphericalDelta.theta -= dx * rotateSpeed;
      sphericalDelta.phi   -= dy * rotateSpeed;
      lastMouse.x = e.touches[0].clientX;
      lastMouse.y = e.touches[0].clientY;
    }
    if (e.touches.length === 2) {
      var dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      sphericalDelta.radius -= (dist - lastTouchDist) * zoomSpeed * 0.005;
      lastTouchDist = dist;
    }
  }

  function onTouchEnd(e) {
    isMouseDown = false;
    setTimeout(function() { isDragging = false; }, 0);
  }

  function onContextMenu(e) {
    if (e.target === renderer.domElement) e.preventDefault();
  }

  renderer.domElement.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  renderer.domElement.addEventListener('wheel', onWheel, { passive: false });
  renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
  renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
  renderer.domElement.addEventListener('touchend', onTouchEnd);
  renderer.domElement.addEventListener('contextmenu', onContextMenu);

  function updateControls() {
    // 自动旋转
    if (autoRotate && !isMouseDown) {
      sphericalDelta.theta -= autoRotateSpeed * 0.008;
    }

    // 阻尼平滑
    spherical.theta += sphericalDelta.theta * dampingFactor;
    spherical.phi   += sphericalDelta.phi   * dampingFactor;
    spherical.radius += sphericalDelta.radius * dampingFactor;

    sphericalDelta.theta *= (1 - dampingFactor);
    sphericalDelta.phi   *= (1 - dampingFactor);
    sphericalDelta.radius *= (1 - dampingFactor);

    updateCameraFromSpherical();
  }

  // ═════════════════════════════════════════
  //  灯光
  // ═════════════════════════════════════════
  var ambientLight = new THREE.AmbientLight('#3a1040', 0.8);
  scene.add(ambientLight);

  var centerLight = new THREE.PointLight('#ff4080', 80, 18, 1.5);
  centerLight.position.set(0, 0, 0);
  scene.add(centerLight);

  var centerLight2 = new THREE.PointLight('#ff6b9d', 30, 25, 2);
  centerLight2.position.set(0, 1, 0);
  scene.add(centerLight2);

  // ═════════════════════════════════════════
  //  星空背景
  // ═════════════════════════════════════════
  (function createStarfield() {
    var count = 2000;
    var positions = new Float32Array(count * 3);
    var colors    = new Float32Array(count * 3);
    var sizes     = new Float32Array(count);

    for (var i = 0; i < count; i++) {
      var theta  = Math.random() * Math.PI * 2;
      var phi    = Math.acos(2 * Math.random() - 1);
      var radius = 20 + Math.random() * 30;
      positions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = radius * Math.cos(phi);

      var colorType = Math.random();
      if (colorType < 0.5)      { colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1; }
      else if (colorType < 0.75) { colors[i*3]=1; colors[i*3+1]=0.65; colors[i*3+2]=0.75; }
      else                       { colors[i*3]=1; colors[i*3+1]=0.85; colors[i*3+2]=0.55; }
      sizes[i] = 0.03 + Math.random() * 0.12;
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

    var mat = new THREE.PointsMaterial({
      size: 0.08, vertexColors: true,
      blending: THREE.AdditiveBlending, depthWrite: false,
      transparent: true, opacity: 0.8,
    });
    scene.add(new THREE.Points(geo, mat));
  })();

  // ═════════════════════════════════════════
  //  中央 3D 爱心
  // ═════════════════════════════════════════
  function createHeartParticles() {
    var heartGroup = new THREE.Group();
    var count = 1500;
    var positions = new Float32Array(count * 3);
    var colors    = new Float32Array(count * 3);
    var scl = 0.09;

    for (var i = 0; i < count; i++) {
      var x, y, xx, yy;
      do {
        x = (Math.random() - 0.5) * 2.4;
        y = (Math.random() * 1.8) - 0.6;
        xx = x * 1.1; yy = y * 1.1;
      } while (Math.pow(xx * xx + yy * yy - 1, 3) - xx * xx * yy * yy * yy > 0);

      var dist = Math.sqrt(x * x + y * y);
      var maxZ = 0.5 * (1 - Math.min(dist / 1.4, 1)) * 0.8;
      var z = (Math.random() - 0.5) * 2 * maxZ;
      positions[i * 3]     = x * scl;
      positions[i * 3 + 1] = y * scl + 0.15;
      positions[i * 3 + 2] = z * scl;

      var t = Math.random();
      colors[i*3]=0.9+t*0.1; colors[i*3+1]=0.15+t*0.2; colors[i*3+2]=0.3+t*0.25;
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

    var spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = 32; spriteCanvas.height = 32;
    var ctx = spriteCanvas.getContext('2d');
    var gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.15, 'rgba(255,150,180,0.9)');
    gradient.addColorStop(0.5, 'rgba(255,80,120,0.3)');
    gradient.addColorStop(1, 'rgba(255,0,60,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 32, 32);
    var spriteTex = new THREE.CanvasTexture(spriteCanvas);

    var mat = new THREE.PointsMaterial({
      size: 0.06, map: spriteTex, vertexColors: true,
      blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
    });
    var points = new THREE.Points(geo, mat);
    heartGroup.add(points);

    var glowGeo = new THREE.SphereGeometry(0.18, 32, 32);
    var glowMat = new THREE.MeshBasicMaterial({
      color: '#ff3060', transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    heartGroup.add(new THREE.Mesh(glowGeo, glowMat));

    heartGroup.userData = { points: points, glowMat: glowMat };
    return heartGroup;
  }

  var heart = createHeartParticles();
  scene.add(heart);

  // ═════════════════════════════════════════
  //  浮游粒子
  // ═════════════════════════════════════════
  var floatingParticles;
  (function createFloatingParticles() {
    var count = 400;
    var positions = new Float32Array(count * 3);
    var sizes     = new Float32Array(count);

    for (var i = 0; i < count; i++) {
      positions[i*3]   = (Math.random()-0.5)*22;
      positions[i*3+1] = (Math.random()-0.5)*16;
      positions[i*3+2] = (Math.random()-0.5)*18;
      sizes[i] = 0.015+Math.random()*0.04;
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

    var mat = new THREE.PointsMaterial({
      size: 0.035, color: '#ff9dbc',
      blending: THREE.AdditiveBlending, depthWrite: false,
      transparent: true, opacity: 0.6,
    });

    floatingParticles = new THREE.Points(geo, mat);
    floatingParticles.userData.initialPositions = new Float32Array(positions);
    scene.add(floatingParticles);
  })();

  // ═════════════════════════════════════════
  //  轨道环系统
  // ═════════════════════════════════════════
  var orbitConfigs = [
    { radius: 9.0, normal: new THREE.Vector3(0.08,0.92,0.38).normalize(), photoCount:14, color:'#ff6b9d', speed:0.18 },
    { radius: 7.5, normal: new THREE.Vector3(0.55,0.62,-0.56).normalize(), photoCount:12, color:'#ff4080', speed:-0.22 },
    { radius: 6.2, normal: new THREE.Vector3(-0.48,0.58,0.66).normalize(), photoCount:10, color:'#ff2d78', speed:0.26 },
    { radius: 5.0, normal: new THREE.Vector3(0.35,0.40,-0.85).normalize(), photoCount:8,  color:'#e040ff', speed:-0.30 },
    { radius: 3.8, normal: new THREE.Vector3(-0.60,0.30,-0.55).normalize(), photoCount:6,  color:'#ff85ab', speed:0.34 },
  ];

  var orbitGroups = [];
  var allPhotoSlots = [];

  function createOrbitalRing(config) {
    var group = new THREE.Group();

    var defaultNormal = new THREE.Vector3(0, 1, 0);
    var q = new THREE.Quaternion().setFromUnitVectors(defaultNormal, config.normal);
    group.quaternion.copy(q);

    // 主环（细管）
    var torusGeo = new THREE.TorusGeometry(config.radius, 0.025, 32, 200);
    var torusMat = new THREE.MeshBasicMaterial({
      color: config.color, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    group.add(new THREE.Mesh(torusGeo, torusMat));

    // 外发光环
    var glowGeo = new THREE.TorusGeometry(config.radius, 0.15, 16, 200);
    var glowMat = new THREE.MeshBasicMaterial({
      color: config.color, transparent: true, opacity: 0.12,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    group.add(new THREE.Mesh(glowGeo, glowMat));

    // 照片槽位
    var slots = [];
    for (var i = 0; i < config.photoCount; i++) {
      var angle = (i / config.photoCount) * Math.PI * 2;
      var slotGroup = new THREE.Group();

      var x = Math.cos(angle) * config.radius;
      var z = Math.sin(angle) * config.radius;
      slotGroup.position.set(x, 0, z);

      var radialDir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).normalize();
      var target = slotGroup.position.clone().add(radialDir);
      slotGroup.lookAt(target);

      // 白色边框
      var frameGeo = new THREE.PlaneGeometry(1.35, 1.05);
      var frameMat = new THREE.MeshBasicMaterial({
        color: '#ffffff', transparent: true, opacity: 0.15,
        side: THREE.DoubleSide, depthWrite: false,
      });
      var frameMesh = new THREE.Mesh(frameGeo, frameMat);
      slotGroup.add(frameMesh);

      // 照片面
      var photoGeo = new THREE.PlaneGeometry(1.2, 0.9);
      var photoMat = new THREE.MeshBasicMaterial({
        color: config.color, side: THREE.DoubleSide, depthWrite: true,
      });
      var photoMesh = new THREE.Mesh(photoGeo, photoMat);
      photoMesh.position.z = 0.005;
      slotGroup.add(photoMesh);

      group.add(slotGroup);
      var slotData = { group: slotGroup, textureMesh: photoMesh, frameMesh: frameMesh, defaultColor: config.color };
      slots.push(slotData);
      allPhotoSlots.push(slotData);
      slotGroup.userData.slotData = slotData;
    }

    group.userData = { config: config, slots: slots };
    scene.add(group);
    orbitGroups.push(group);
    return group;
  }

  orbitConfigs.forEach(function(c) { createOrbitalRing(c); });

  // ═════════════════════════════════════════
  //  默认占位纹理
  // ═════════════════════════════════════════
  function createPlaceholderTexture(colorHex, index) {
    var size = 256;
    var c = document.createElement('canvas');
    c.width = size; c.height = Math.round(size * 0.75);
    var ctx = c.getContext('2d');

    var hue = (parseInt(colorHex.slice(1), 16) + index * 40) % 360;
    var grad = ctx.createLinearGradient(0, 0, size, size * 0.75);
    grad.addColorStop(0, 'hsl(' + hue + ', 70%, 25%)');
    grad.addColorStop(0.5, 'hsl(' + ((hue + 20) % 360) + ', 80%, 20%)');
    grad.addColorStop(1, 'hsl(' + ((hue + 40) % 360) + ', 70%, 18%)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size * 0.75);

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '60px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('❤', size / 2, size * 0.375);

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '20px sans-serif';
    ctx.fillText(String(index + 1), size / 2, size * 0.55);

    return new THREE.CanvasTexture(c);
  }

  allPhotoSlots.forEach(function(slot, i) {
    var tex = createPlaceholderTexture(slot.defaultColor, i);
    tex.colorSpace = THREE.SRGBColorSpace;
    slot.textureMesh.material.map = tex;
    slot.textureMesh.material.color.set('#ffffff');
    slot.textureMesh.material.needsUpdate = true;
  });

  // ═════════════════════════════════════════
  //  文件加载
  // ═════════════════════════════════════════
  var userTextures = [];

  function showToast(msg, duration) {
    duration = duration || 2500;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(function() { toastEl.classList.remove('show'); }, duration);
  }

  function loadImageFile(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var tw = 512, th = 384;
          canvas.width = tw; canvas.height = th;
          var ctx = canvas.getContext('2d');

          var iw = img.width, ih = img.height;
          var targetRatio = 4 / 3;
          var imgRatio = iw / ih;
          var sx, sy, sw, sh;
          if (imgRatio > targetRatio) {
            sh = ih; sw = ih * targetRatio; sy = 0; sx = (iw - sw) / 2;
          } else {
            sw = iw; sh = iw / targetRatio; sx = 0; sy = (ih - sh) / 2;
          }
          ctx.fillStyle = '#1a0020';
          ctx.fillRect(0, 0, tw, th);
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, tw, th);

          var tex = new THREE.CanvasTexture(canvas);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.generateMipmaps = true;
          resolve(tex);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function applyTextures() {
    if (userTextures.length === 0) return;
    allPhotoSlots.forEach(function(slot, i) {
      var tex = userTextures[i % userTextures.length];
      slot.textureMesh.material.map = tex;
      slot.textureMesh.material.color.set('#ffffff');
      slot.textureMesh.material.needsUpdate = true;
      slot.frameMesh.material.opacity = 0.08;
    });
  }

  async function handleFiles(files) {
    var imageFiles = Array.from(files).filter(function(f) { return f.type.startsWith('image/'); });
    if (imageFiles.length === 0) {
      showToast('未检测到图片文件');
      return;
    }

    showToast('正在加载 ' + imageFiles.length + ' 张照片...');

    // 清理旧纹理
    userTextures.forEach(function(t) { if (t.dispose) t.dispose(); });
    userTextures = [];

    var concurrency = 8;
    for (var i = 0; i < imageFiles.length; i += concurrency) {
      var batch = imageFiles.slice(i, i + concurrency);
      var textures = await Promise.all(batch.map(function(f) {
        return loadImageFile(f).catch(function() { return null; });
      }));
      for (var j = 0; j < textures.length; j++) {
        if (textures[j]) userTextures.push(textures[j]);
      }
    }

    applyTextures();
    showToast('已加载 ' + userTextures.length + ' 张照片 ✨');
  }

  // ── 文件选择器 ──
  btnUpload.addEventListener('click', function() { fileInput.click(); });
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) handleFiles(fileInput.files);
  });

  // ── 拖拽支持 ──
  var dragCounter = 0;
  document.addEventListener('dragenter', function(e) {
    e.preventDefault();
    dragCounter++;
    if (dragCounter === 1) dropOverlay.classList.add('active');
  });
  document.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dragCounter--;
    if (dragCounter === 0) dropOverlay.classList.remove('active');
  });
  document.addEventListener('dragover', function(e) { e.preventDefault(); });
  document.addEventListener('drop', async function(e) {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('active');

    var items = e.dataTransfer.items;
    if (!items) return;

    var files = [];
    function traverse(entry) {
      return new Promise(function(resolve) {
        if (entry.isFile) {
          entry.file(function(file) { files.push(file); resolve(); });
        } else if (entry.isDirectory) {
          var reader = entry.createReader();
          reader.readEntries(async function(entries) {
            for (var i = 0; i < entries.length; i++) await traverse(entries[i]);
            resolve();
          });
        } else { resolve(); }
      });
    }

    for (var i = 0; i < items.length; i++) {
      var entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
      if (entry) await traverse(entry);
      else if (items[i].kind === 'file') files.push(items[i].getAsFile());
    }

    if (files.length > 0) await handleFiles(files);
  });

  // ═════════════════════════════════════════
  //  动画循环
  // ═════════════════════════════════════════
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    var t = clock.getElapsedTime();
    updateControls();

    // 旋转轨道环
    for (var i = 0; i < orbitGroups.length; i++) {
      var cfg = orbitGroups[i].userData.config;
      orbitGroups[i].rotateY(cfg.speed * 0.008);
    }

    // 心动效果
    var beat = 1 + Math.sin(t * 2.5) * 0.06 + Math.sin(t * 5.0) * 0.03;
    heart.scale.setScalar(beat);
    heart.userData.glowMat.opacity = 0.12 + Math.sin(t * 2.5) * 0.05;

    // 中心光呼吸
    centerLight.intensity = 75 + Math.sin(t * 2.5) * 15;
    centerLight2.intensity = 28 + Math.sin(t * 2.5 + 1) * 10;

    // 浮游粒子
    var fpPos = floatingParticles.geometry.attributes.position.array;
    var fpInit = floatingParticles.userData.initialPositions;
    for (var j = 0; j < fpPos.length; j += 3) {
      fpPos[j + 1] = fpInit[j + 1] + Math.sin(t * 0.7 + j) * 0.3;
      fpPos[j]     = fpInit[j]     + Math.cos(t * 0.5 + j) * 0.2;
    }
    floatingParticles.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }

  // ═════════════════════════════════════════
  //  响应式
  // ═════════════════════════════════════════
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ═════════════════════════════════════════
  //  键盘快捷键
  // ═════════════════════════════════════════
  window.addEventListener('keydown', function(e) {
    switch(e.key.toLowerCase()) {
      case 'r':
        autoRotate = !autoRotate;
        showToast(autoRotate ? '自动旋转：开' : '自动旋转：关');
        break;
      case '0':
        target.set(0, 0.3, 0);
        spherical.set(14, Math.PI/3, Math.PI/4);
        sphericalDelta.set(0,0,0);
        updateControls();
        break;
      case 'h':
        uiLayer.style.opacity = (uiLayer.style.opacity === '0' ? '1' : '0');
        break;
    }
  });

  // ═════════════════════════════════════════
  //  启动
  // ═════════════════════════════════════════
  loadingMsg.style.opacity = '0';
  uiLayer.classList.add('ready');
  animate();

  console.log('💕 520 照片星球已就绪');
  console.log('  拖拽旋转 | 滚轮缩放');
  console.log('  按 R 切换自动旋转 | 按 H 隐藏UI');
  console.log('  选择照片文件夹或拖拽照片到页面');
})();
</script>
</body>
